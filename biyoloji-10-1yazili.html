<!-- ===================== ÜNİTE 1 ===================== -->
<section data-id="1-1" data-unit="1" data-title="Enerji nedir, neden gereklidir?">
<p class="lead">Canlılar yaşamlarını sürdürebilmek için <b>sürekli enerjiye</b> ihtiyaç duyar. Enerji sağlanamazsa hücredeki olaylar durur ve hücre ölür.</p>
<h3>Enerji nedir?</h3>
<p><b>Enerji</b>, iş yapabilme yeteneği ya da bir değişikliğe neden olma kapasitesidir.</p>
<ul>
<li>Doğada farklı biçimlerde bulunur: <b>ışık, ısı, elektrik, ses, hareket, potansiyel, kimyasal ve nükleer</b> enerji.</li>
<li>Enerji <b>yoktan var edilemez, yok edilemez</b>. Sadece bir biçimden başka bir biçime <b>dönüşür</b> ya da bir yerden başka yere aktarılır.</li>
<li>Canlılar da enerjiyi dönüştürür. Bitki ışık enerjisini kimyasal enerjiye, kas hücresi kimyasal enerjiyi hareket enerjisine dönüştürür.</li>
</ul>
<h3>Hangi olaylar enerji ister?</h3>
<div class="chips">
<span>🌱 Büyüme ve gelişme</span><span>🧬 Hücre bölünmesi</span><span>🚪 Aktif taşıma</span><span>💪 Kas kasılması, hareket</span><span>🌡️ Vücut sıcaklığını koruma</span><span>⚡ Sinirsel iletim</span><span>🏗️ Biyosentez (protein, yağ, karbonhidrat yapımı)</span><span>🩹 Onarım (yara iyileşmesi)</span><span>🐣 Üreme</span>
</div>
<div class="box ornek"><b>💡 Örnek</b>Koşan bir öğrencide bacak kaslarının kasılması, kalbin atması, sinirlerin beyne mesaj taşıması, terleyerek vücut ısısının dengelenmesi enerji harcar. Uyurken bile kalp atışı, solunum ve vücut sıcaklığının korunması için enerji harcanır.</div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>"Uyuyan ya da dinlenen canlı enerji harcamaz" ifadesi <b>yanlıştır</b>. Canlı yaşadığı sürece enerji harcar, sadece harcadığı miktar azalır.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Canlılar için enerji neden gereklidir?</span>Canlılar büyüme, hücre bölünmesi, aktif taşıma, kas kasılması, sinirsel iletim ve vücut sıcaklığını koruma gibi yaşamsal faaliyetleri enerji kullanarak gerçekleştirir. Enerji sağlanamazsa bu faaliyetler durur ve canlı yaşamını sürdüremez.</div>
</section>

<section data-id="1-2" data-unit="1" data-title="Enerji kaynakları ve enerji akışı">
<h3>Ototrof ve heterotrof canlılar</h3>
<div class="grid2">
<div class="gcard"><h4>🌿 Ototrof (üretici)</h4><ul><li>İnorganik maddelerden (CO₂, H₂O) <b>kendi besinini üretir</b>.</li><li>Enerji kaynağı: güneş ışığı (fotosentez) ya da inorganik maddelerin kimyasal enerjisi (kemosentez).</li><li>Örnek: bitkiler, algler, siyanobakteriler</li></ul></div>
<div class="gcard"><h4>🐇 Heterotrof (tüketici)</h4><ul><li>Besinini üretemez, <b>hazır organik besin</b> alır.</li><li>Enerjiyi besinlerin kimyasal bağlarından elde eder.</li><li>Örnek: hayvanlar, mantarlar, insan</li></ul></div>
</div>
<h3>Canlılarda enerji akışı</h3>
<div class="flow">
<div class="st">☀️ Güneş<small>ışık enerjisi</small></div>
<div class="ar">↓ fotosentez (bitki)</div>
<div class="st">🍞 Besin (glikoz, nişasta, yağ)<small>kimyasal bağ enerjisi</small></div>
<div class="ar">↓ hücresel solunum (besinin hücrede parçalanması)</div>
<div class="st">⚡ ATP<small>hücrenin doğrudan kullandığı enerji molekülü</small></div>
<div class="ar">↓</div>
<div class="st">🏃 Yaşamsal faaliyetler<small>kasılma, aktif taşıma, sinirsel iletim, biyosentez</small></div>
</div>
<ul>
<li>Yeryüzündeki temel enerji kaynağı <b>Güneş</b>'tir.</li>
<li>Tüketiciler bu kimyasal enerjiyi besin zinciriyle, yani başka canlıları yiyerek alır.</li>
<li>Her basamakta enerjinin bir kısmı <b>ısı</b> olarak ortama verilir.</li>
</ul>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>Canlılar besinlerdeki enerjiyi yaşamsal faaliyetlerde <b>doğrudan kullanamaz</b>. Besin önce hücrede parçalanır, açığa çıkan enerji <b>ATP</b>'ye aktarılır. Koşan bir öğrencinin kasları fıstıktaki ya da şekerdeki enerjiyi değil, <b>ATP</b>'yi doğrudan kullanır.</div>
<div class="box ornek"><b>💡 Örnek: Besin yakma deneyi</b>Eşit kütlede farklı besinler yakılarak eşit miktarda su ısıtılır. Suyu en çok ısıtan besin, gramında en fazla enerjiyi içerir. Yağ bakımından zengin besinler (fıstık gibi) genellikle suyu en çok ısıtır.<br><br>Fark: Besin yakılınca enerji <b>bir anda ısı ve ışık</b> olarak açığa çıkar. Hücrede ise besin enzimlerle <b>basamak basamak</b> parçalanır ve enerjinin bir kısmı <b>ATP</b>'ye aktarılır.</div>
<div class="box ornek"><b>💡 Örnek: Kapalı şişe bahçesi</b>İçine bitki ve toprak konup ağzı kapatılan bir şişe, pencere önünde yıllarca yaşayabilir.<ul><li>Şişeye dışarıdan <b>ışık enerjisi</b> girer.</li><li>Şişeden dışarı <b>ısı enerjisi</b> çıkar.</li><li>CO₂, O₂ ve su şişenin içinde döner durur. Bitki fotosentezde CO₂ kullanıp O₂ verir, solunumda O₂ kullanıp CO₂ verir.</li><li>Şişe aylarca karanlıkta kalırsa fotosentez durur, yeni besin üretilemez. Depo besinler bitince bitki ölür.</li></ul></div>
<div class="box akil"><b>🧠 Akılda kalsın</b>Enerji akışı <b>tek yönlüdür</b>: Güneş'ten gelir, ısı olarak gider. Madde ise <b>döngüseldir</b>: karbon, oksijen ve su tekrar tekrar kullanılır.</div>
</section>

<section data-id="1-3" data-unit="1" data-star="1" data-title="ATP'nin yapısı">
<div class="box ogr"><b>⭐ Öğretmenin vurguladığı</b>Öğretmeninizin sınıfta sorduğu 2 sorudan biri <b>ATP</b> ile ilgili. Bu bölüm en önemli bölümlerden biridir.</div>
<p><b>ATP (adenozin trifosfat):</b> Bütün canlı hücrelerde enerji aktarımında kullanılan <b>ortak (evrensel)</b> moleküldür. <b>Nükleotit</b> yapılıdır.</p>
<h3>ATP'nin 3 yapı birimi</h3>
<ol>
<li><b>Adenin:</b> azotlu organik baz</li>
<li><b>Riboz:</b> 5 karbonlu şeker</li>
<li><b>3 fosfat grubu:</b> P–P–P</li>
</ol>

<h3>3 bağ çeşidi</h3>
<div class="tw"><table>
<tr><th>Bağ</th><th>Nerede?</th><th>ATP'de sayısı</th></tr>
<tr><td><b>Glikozit bağı</b></td><td>Adenin ile riboz arasında</td><td>1</td></tr>
<tr><td><b>Ester bağı</b></td><td>Riboz ile ilk fosfat arasında</td><td>1</td></tr>
<tr><td><b>Fosfat bağı</b> (yüksek enerjili)</td><td>Fosfatlar arasında</td><td>2</td></tr>
</table></div>
<h3>Adenozin → AMP → ADP → ATP</h3>
<div class="formula">Adenin + Riboz = Adenozin</div>
<div class="formula">Adenozin + 1 P = AMP <small>adenozin monofosfat</small></div>
<div class="formula">Adenozin + 2 P = ADP <small>adenozin difosfat</small></div>
<div class="formula">Adenozin + 3 P = ATP <small>adenozin trifosfat</small></div>
<div class="tw"><table>
<tr><th>Molekül</th><th>Fosfat</th><th>Fosfat bağı</th><th>Ester</th><th>Glikozit</th></tr>
<tr><td><b>ATP</b></td><td>3</td><td>2</td><td>1</td><td>1</td></tr>
<tr><td><b>ADP</b></td><td>2</td><td>1</td><td>1</td><td>1</td></tr>
<tr><td><b>AMP</b></td><td>1</td><td>0</td><td>1</td><td>1</td></tr>
<tr><td>Adenozin</td><td>0</td><td>0</td><td>0</td><td>1</td></tr>
</table></div>
<div class="box akil"><b>🧠 Akılda kalsın</b>Mono = 1, di = 2, tri = 3.<br>ATP'de <b>3 fosfat</b> var ama <b>2 fosfat bağı</b> var, çünkü bağ fosfatların <i>arasında</i> kurulur.</div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b><ul><li>Enerji en çok <b>fosfatlar arasındaki bağlarda</b> bulunur. Hücre genellikle <b>en uçtaki</b> fosfat bağını koparır, ATP → ADP olur.</li><li>Glikozit bağı ve ester bağı "yüksek enerjili bağ" <b>değildir</b>.</li><li>ATP'deki şeker <b>ribozdur</b> (5 karbonlu), glikoz değildir.</li></ul></div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: ATP'yi oluşturan yapı birimlerini ve bunları bağlayan bağları yazınız.</span>ATP; adenin bazı, riboz şekeri ve üç fosfat grubundan oluşur. Adenin ile riboz arasında glikozit bağı, riboz ile ilk fosfat arasında ester bağı, fosfat grupları arasında ise iki adet yüksek enerjili fosfat bağı bulunur.</div>
</section>

<section data-id="1-4" data-unit="1" data-star="1" data-title="Fosforilasyon ve defosforilasyon">
<div class="box ogr"><b>⭐ Öğretmenin vurguladığı</b>ATP sorusunda en çok bu iki olay sorulur. Denklemleri ezbere yazabilmelisin.</div>
<div class="grid2">
<div class="gcard"><h4>🔻 Defosforilasyon (ATP yıkımı)</h4><p>ATP'den bir fosfat <b>ayrılır</b>.</p><ul><li>Su <b>kullanılır</b> → hidroliz (su ile parçalanma)</li><li>Enerji <b>açığa çıkar</b> → ekzergonik</li></ul></div>
<div class="gcard"><h4>🔺 Fosforilasyon (ATP sentezi)</h4><p>ADP'ye bir fosfat <b>eklenir</b>.</p><ul><li>Su <b>açığa çıkar</b> → dehidrasyon sentezi (su çıkışıyla birleştirme)</li><li>Enerji <b>harcanır</b> → endergonik</li></ul></div>
</div>
<div class="formula">ATP + H₂O → ADP + Pᵢ + Enerji<small>Defosforilasyon: açığa çıkan enerji kas kasılması, aktif taşıma, sinirsel iletim ve biyosentezde kullanılır.</small></div>
<div class="formula">ADP + Pᵢ + Enerji → ATP + H₂O<small>Fosforilasyon: gereken enerji hücresel solunumla besinlerin parçalanmasından sağlanır.</small></div>
<p><b>Pᵢ</b> = inorganik fosfat</p>
<h3>Karşılaştırma tablosu</h3>
<div class="tw"><table>
<tr><th>Özellik</th><th>Fosforilasyon</th><th>Defosforilasyon</th></tr>
<tr><td>Ne olur?</td><td>ADP'ye fosfat eklenir</td><td>ATP'den fosfat ayrılır</td></tr>
<tr><td>Ürün</td><td>ATP + H₂O</td><td>ADP + Pᵢ</td></tr>
<tr><td>Su</td><td>Açığa çıkar</td><td>Harcanır (hidroliz)</td></tr>
<tr><td>Enerji</td><td>Harcanır, ATP'ye yüklenir</td><td>Açığa çıkar</td></tr>
<tr><td>Tepkime türü</td><td><b>Endergonik</b></td><td><b>Ekzergonik</b></td></tr>
<tr><td>Yapım / yıkım</td><td>Yapım</td><td>Yıkım</td></tr>
</table></div>
<div class="box akil"><b>🧠 Akılda kalsın</b><ul><li><b>De</b>fosforilasyon: fosfat <b>ayrılır</b>, enerji dışarı çıkar.</li><li><b>Ekz</b>ergonik: ekz = dış, enerji dışarı verilir.</li><li><b>End</b>ergonik: end = iç, enerji içeri alınır.</li></ul></div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b><ul><li>"Fosforilasyonda enerji açığa çıkar" → <b>Yanlış</b>. Fosforilasyon enerji ister, enerji ATP'de depolanır.</li><li>"ATP yıkımında su açığa çıkar" → <b>Yanlış</b>. ATP yıkımında su <b>harcanır</b>.</li></ul></div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Fosforilasyon ve defosforilasyonu tanımlayıp hangisinin ekzergonik, hangisinin endergonik olduğunu belirtiniz.</span><b>Fosforilasyon</b>, ADP'ye enerji kullanılarak bir inorganik fosfat eklenmesi ve ATP sentezlenmesidir (ADP + Pᵢ + Enerji → ATP + H₂O). Enerji gerektirdiği için <b>endergoniktir</b>.<br><b>Defosforilasyon</b>, ATP'nin su kullanılarak ADP ve inorganik fosfata parçalanmasıdır (ATP + H₂O → ADP + Pᵢ + Enerji). Enerji açığa çıktığı için <b>ekzergoniktir</b>.</div>
</section>

<p>ATP hücrede sürekli yıkılır ve yeniden yapılır. Bu sürekli dönüşüme <b>ATP–ADP döngüsü</b> denir. Bu yüzden ATP <b>yenilenebilir bir enerji taşıyıcısıdır</b>.</p>
<h3>Ekzergonik ve endergonik tepkimeler</h3>
<div class="tw"><table>
<tr><th></th><th>Ekzergonik</th><th>Endergonik</th></tr>
<tr><td>Anlamı</td><td>Enerji <b>açığa çıkaran</b></td><td>Enerji <b>gerektiren</b></td></tr>
<tr><td>Genelde</td><td>Yıkım tepkimeleri</td><td>Yapım tepkimeleri</td></tr>
<tr><td>Örnek</td><td>Hücresel solunum (glikozun parçalanması), ATP → ADP, sindirim</td><td>Protein sentezi, ATP sentezi (ADP → ATP), fotosentez (glikoz yapımı)</td></tr>
</table></div>
<p>Hücrede bu iki tür tepkime <b>birlikte</b> gerçekleşir.</p>
<h3>ATP'nin köprü görevi</h3>
<div class="flow">
<div class="st">🔥 Ekzergonik tepkime<small>Örnek: hücresel solunum, glikozun parçalanması</small></div>
<div class="ar">↓ açığa çıkan enerji ile ADP + Pᵢ → ATP (fosforilasyon)</div>
<div class="st">⚡ ATP<small>enerjiyi taşır</small></div>
<div class="ar">↓ ATP → ADP + Pᵢ (defosforilasyon), enerji açığa çıkar</div>
<div class="st">🏗️ Endergonik olay<small>Örnek: protein sentezi, kas kasılması, aktif taşıma</small></div>
</div>
<div class="box ornek"><b>💡 Örnek: Para benzetmesi</b>Besindeki enerji bankadaki para, ATP cebindeki bozuk para gibidir. Alışveriş (hücresel işler) bozuk parayla yapılır. Bozuk para bitince bankadan yeniden çekilir, yani yeni ATP üretilir.</div>
<div class="box ornek"><b>💡 Örnek</b>Bir hücrede protein sentezi ve aktif taşıma devam ederken ATP miktarı sabit kalıyor. Bu, ATP'nin tüketilmediğini <b>göstermez</b>. Tüketilen ATP kadar yeni ATP aynı hızda üretiliyordur: <b>üretim hızı = tüketim hızı</b>.</div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>ATP sentezi durursa hücredeki mevcut ATP ancak kısa bir süre yeter. Sonra ATP'ye bağlı olaylar (protein sentezi, aktif taşıma) durur.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: ATP'nin ekzergonik ve endergonik tepkimeler arasındaki köprü görevini açıklayınız.</span>Hücresel solunum gibi ekzergonik tepkimelerde açığa çıkan enerji, ADP'ye inorganik fosfat bağlanarak ATP sentezlenmesinde (fosforilasyon) kullanılır. ATP su kullanılarak ADP ve inorganik fosfata parçalandığında (defosforilasyon) enerji açığa çıkar. Bu enerji protein sentezi, aktif taşıma gibi endergonik olaylarda kullanılır. Böylece ATP, enerji açığa çıkaran tepkimeler ile enerji gerektiren tepkimeler arasında bağlantı kurar.</div>
</section>

<section data-id="1-6" data-unit="1" data-star="1" data-title="ATP'nin özellikleri ve canlılık için önemi">
<div class="box ogr"><b>⭐ Öğretmenin vurguladığı</b>ATP sorusunda "neden depolanmaz, neden her hücre kendisi üretir, ATP üretilmezse ne olur" gibi yorum soruları gelebilir.</div>
<h3>ATP'nin özellikleri</h3>
<ol>
<li><b>Ortaktır (evrenseldir):</b> Bakteriden insana bütün canlılarda kullanılır.</li>
<li><b>Depolanmaz:</b> Uzun süreli enerji deposu değildir, <b>kısa süreli enerji taşıyıcısıdır</b>. İhtiyaç olunca üretilir, hemen tüketilir.<br>Uzun süreli enerji depoları: <b>yağ</b>, <b>glikojen</b> (hayvanlarda karaciğer ve kasta), <b>nişasta</b> (bitkilerde).</li>
<li><b>Hücre zarından geçemez:</b> Büyük ve yüklü bir moleküldür. Bir hücreden diğerine aktarılamaz, kanla taşınmaz.<br>→ <b>Her hücre kendi ATP'sini kendisi üretir.</b> Kanla hücrelere taşınan ATP değil, glikoz ve O₂'dir.</li>
<li><b>Nerede üretilir?</b> Hücresel solunumla (besinin sitoplazma ve mitokondride parçalanması), oksijensiz ortamda fermantasyonla. Bitkilerde ayrıca fotosentez sırasında kloroplastta.</li>
<li><b>Enerjisi başka biçimlere dönüşür:</b> hareket (kas), elektrik (sinirsel iletim), ısı (vücut sıcaklığı), ışık (ateş böceği).</li>
</ol>
<div class="box akil"><b>🧠 Akılda kalsın</b>Enerjinin asıl kaynağı <b>besinlerdir</b> (en başta Güneş). ATP ise hücrenin bu enerjiyi <b>doğrudan kullanabildiği taşıyıcı moleküldür</b>.</div>
<h3>Deney: ATP üretimi engellenirse ne olur?</h3>
<p>Aynı özellikteki hücreler iki kaba konur. Birine ATP üretimini engelleyen bir madde eklenir.</p>
<div class="tw"><table>
<tr><th>Gözlem</th><th>Kontrol grubu<br><small>besin + O₂</small></th><th>Deney grubu<br><small>+ ATP'yi engelleyen madde</small></th></tr>
<tr><td>Canlılık</td><td>Devam ediyor</td><td>Belirgin şekilde azalıyor</td></tr>
<tr><td>Aktif taşıma</td><td>Devam ediyor</td><td>Büyük ölçüde duruyor</td></tr>
<tr><td>Kasılma / hareket</td><td>Devam ediyor</td><td>Gerçekleşmiyor</td></tr>
<tr><td>Çoğalma</td><td>Var</td><td>Yok</td></tr>
</table></div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>Deney grubunda ortamda <b>besin (glikoz) vardır</b> ama hücreler yine ölür. Çünkü besindeki enerji ATP'ye aktarılamazsa hücre bu enerjiyi kullanamaz.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Deney bulgularına dayanarak ATP'nin canlılık için önemini açıklayınız.</span>ATP üretimi engellenen hücrelerde aktif taşıma, kasılma ve bölünme gibi enerji gerektiren faaliyetler durmuş, hücrelerin canlılığı olumsuz etkilenmiştir. Bu, canlı hücrelerin yaşamsal faaliyetleri için ATP'ye ihtiyaç duyduğunu gösterir. ATP üretilemezse hücre bölünemez, madde alışverişi yapamaz, enzimatik tepkimeleri gerçekleştiremez ve ölür. Yani enerji canlılık için yalnızca önemli değil, <b>zorunludur</b>.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: ATP hücre zarından geçemez ve depolanamaz. Buna göre hücreler enerji ihtiyacını nasıl karşılar?</span>ATP büyük ve yüklü bir molekül olduğu için hücre zarından geçemez, bir hücreden diğerine aktarılamaz ve depolanamaz. Bu nedenle her canlı hücre ihtiyaç duyduğu ATP'yi hücresel solunum veya fermantasyonla kendi içinde, anlık olarak üretir ve tüketir.</div>
</section>

<section data-id="1-7" data-unit="1" data-title="Kış uykusu, sıcakkanlı ve soğukkanlı canlılar">
<p>Kirpi, ayı, fındık faresi, yarasa gibi bazı memeliler kış gelmeden önce bol beslenir ve vücutlarında <b>yüksek miktarda yağ ve glikojen</b> depolar.</p>
<h3>Kış uykusunda enerji nereden gelir?</h3>
<div class="flow">
<div class="st">🥜 Depo yağ ve glikojen</div>
<div class="ar">↓ hücresel solunumla parçalanır</div>
<div class="st">⚡ ATP üretilir</div>
<div class="ar">↓</div>
<div class="st">❤️ Vücut sıcaklığı belli düzeyde tutulur, kalp atar, solunum sürer</div>
</div>
<ul>
<li><b>Metabolizma</b> (hücredeki tüm tepkimeler) yavaşlar ama <b>durmaz</b>.</li>
<li>Vücut sıcaklığı düşer ama belirli bir düzeyin altına inmez.</li>
<li>Besin alınmadığı için depolar tükenir, canlı baharda zayıflamış olarak uyanır.</li>
</ul>
<h3>Sıcakkanlı ve soğukkanlı canlılar</h3>

<tr><td>Ortam ısınınca</td><td>Isı üretmeye daha az enerji gerekir → O₂ tüketimi azalır</td><td>Vücut ısınır, enzimler hızlanır → O₂ tüketimi artar</td></tr>

<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Kış uykusundaki memeli besin almadığı hâlde yaşamını nasıl sürdürür?</span>Kış uykusuna yatmadan önce vücudunda depoladığı yağ ve glikojen, hücresel solunumla parçalanır. Açığa çıkan enerji ATP'ye aktarılır. Bu ATP, vücut sıcaklığını belirli düzeyde tutmak, kalp atışı ve solunum gibi yaşamsal faaliyetleri sürdürmek için kullanılır. Metabolizma yavaşladığı için depolar uzun süre yeter.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Kış uykusundaki memeliler ile kışın hareketsiz kalan sürüngenlerin enerji tasarrufu arasındaki fark nedir?</span>Memeliler sıcakkanlıdır. Kış uykusunda metabolizmalarını yavaşlatsalar da vücut sıcaklıklarını belirli bir düzeyde tutmak için depo besinlerinden enerji harcarlar. Sürüngenler soğukkanlıdır. Vücut sıcaklıkları ortamla birlikte düşer, metabolizmaları kendiliğinden yavaşlar ve ısı üretmek için enerji harcamazlar.</div>
</section>

<section data-id="1-8" data-unit="1" data-title="Hızlı tekrar: Enerji ve ATP">
<ul class="qr">
<li>⚡ Enerji iş yapabilme yeteneğidir. Yok olmaz, biçim değiştirir.</li>
<li>☀️ Güneş → fotosentez → besin (kimyasal enerji) → hücresel solunum → <b>ATP</b> → yaşamsal faaliyetler</li>
<li>🚫 Besin enerjisi doğrudan kullanılmaz, önce ATP'ye aktarılır.</li>
<li>🧩 ATP = <b>adenin + riboz + 3 fosfat</b>. Bağlar: 1 glikozit, 1 ester, 2 yüksek enerjili fosfat bağı.</li>
<li>🔢 Adenozin → AMP (1P) → ADP (2P) → ATP (3P)</li>
<li>🔻 Defosforilasyon: ATP + H₂O → ADP + Pᵢ + Enerji (hidroliz, <b>ekzergonik</b>)</li>
<li>🔺 Fosforilasyon: ADP + Pᵢ + Enerji → ATP + H₂O (<b>endergonik</b>)</li>
<li>🔁 ATP–ADP döngüsü: ATP sürekli yıkılır ve yeniden yapılır.</li>
<li>🌉 ATP, ekzergonik tepkimelerden aldığı enerjiyi endergonik tepkimelere taşır.</li>
<li>📦 ATP depolanmaz, hücre zarından geçemez, her hücre kendi ATP'sini üretir. Uzun süreli depolar: yağ, glikojen, nişasta.</li>
<li>☠️ ATP üretilemezse aktif taşıma, kasılma, bölünme durur → hücre ölür.</li>
<li>🦔 Kış uykusu: depo yağ → solunum → ATP → vücut ısısı korunur.</li>
<li>🐭 Sıcakkanlı soğukta daha çok O₂ tüketir. 🦎 Soğukkanlı sıcakta daha çok O₂ tüketir.</li>
</ul>
</section>

<!-- ===================== ÜNİTE 2 ===================== -->
<section data-id="2-1" data-unit="2" data-star="1" data-title="Fotosentez nedir? Genel denklem">
<div class="box ogr"><b>⭐ Öğretmenin vurguladığı</b>"Enerji ve fotosentez iyi çalışın." Sınıfta sorulan 2 sorudan biri <b>fotosentezde kullanılan ve üretilen maddeler</b>.</div>
<p class="lead"><b>Fotosentez:</b> Klorofil taşıyan canlıların <b>ışık enerjisini</b> kullanarak inorganik maddelerden (<b>CO₂ ve H₂O</b>) organik madde (<b>glikoz</b>) üretmesidir.</p>
<ul>
<li><b>Kimler yapar?</b> Bitkiler (tam parazit bitkiler hariç), algler, öglena gibi bazı protistler, siyanobakteriler ve bazı bakteriler.</li>
<li><b>Nerede?</b> Bitkilerde <b>kloroplast</b> organelinde. En çok yapraklarda gerçekleşir.</li>
</ul>
<h3>Genel denklem</h3>
<div class="formula">6CO₂ + 6H₂O <span style="color:var(--u2)">—ışık, klorofil→</span> C₆H₁₂O₆ + 6O₂<small>Sadeleştirilmiş denklem (yazılıda bunu yazman yeterli)</small></div>
<div class="formula">6CO₂ + 12H₂O → C₆H₁₂O₆ + 6O₂ + 6H₂O<small>Ayrıntılı denklem: su hem kullanılır hem açığa çıkar.</small></div>
<div class="grid2">
<div class="gcard"><h4>⬅️ Kullanılanlar</h4><ul><li>Karbondioksit (CO₂)</li><li>Su (H₂O)</li></ul><h4 style="margin-top:8px">⚙️ Gerekli koşullar</h4><ul><li>Işık enerjisi</li><li>Klorofil</li><li>Enzimler</li></ul></div>
<div class="gcard"><h4>➡️ Üretilenler</h4><ul><li>Glikoz (C₆H₁₂O₆) → fazlası <b>nişasta</b> olarak depolanır</li><li>Oksijen (O₂)</li><li>(Su)</li></ul></div>
</div>
<h3>Fotosentezde enerji dönüşümü</h3>
<div class="formula">Işık enerjisi → Kimyasal bağ enerjisi (glikozda)</div>
<p>Fotosentez enerji gerektiren (<b>endergonik</b>) bir yapım olayıdır. Güneşin enerjisi besinin bağlarına depolanır.</p>
<h3>Fotosentezin önemi</h3>
<ul>
<li>Canlılar için hem <b>besin</b> hem <b>oksijen</b> kaynağıdır.</li>
<li>Atmosferdeki CO₂ azalır, O₂ artar.</li>
<li>Besin zincirinin temelini oluşturur, bütün tüketiciler dolaylı olarak fotosenteze bağlıdır.</li>
</ul>
<div class="box akil"><b>🧠 Akılda kalsın: Fotosentez ve solunum terstir</b><ul><li>Fotosentez: CO₂ + H₂O → glikoz + O₂ (enerji depolanır)</li><li>Hücresel solunum: glikoz + O₂ → CO₂ + H₂O + ATP (enerji açığa çıkar)</li></ul>Bitkiler hem fotosentez hem solunum yapar. Hayvanlar sadece solunum yapar.</div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>Bitkiler gece de gündüz de <b>solunum yapar</b> ve O₂ kullanır. Işıkta fotosentez solunumdan hızlı olduğu için dışarı <b>net O₂</b> verilir. Karanlıkta sadece solunum olur, dışarı <b>CO₂</b> verilir.</div>
</section>

<section data-id="2-2" data-unit="2" data-star="1" data-title="Kullanılan ve üretilen maddeler: nereden gelir, nereye gider?">
<div class="box ogr"><b>⭐ Öğretmenin vurguladığı</b>Bu ders öğretmenin işaret ettiği ikinci sorunun konusudur. Her maddenin <b>nereden geldiğini</b>, <b>ne işe yaradığını</b> ve <b>hangi deneyle gösterildiğini</b> bilmelisin.</div>
<div class="exp"><h4>🌬️ Karbondioksit (CO₂) – kullanılır</h4>
<div class="row"><span class="lbl">Nereden?</span> Havadan, yapraktaki gözeneklerden (stoma) girer. Su bitkileri suda çözünmüş CO₂'yi kullanır.</div>
<div class="row"><span class="lbl">Görevi:</span> Glikozun <b>karbon kaynağıdır</b>. Karbon atomları organik moleküllerin yapısına katılır.</div>
<div class="row"><span class="lbl">Yoksa:</span> Fotosentez yavaşlar veya durur, glikoz ve nişasta oluşmaz.</div>
<div class="row"><span class="lbl">Bilgi:</span> Ağaçların kütlesinin yaklaşık %50–80'i karbondan oluşur. Bu karbon topraktan değil, <b>havadaki CO₂'den</b> gelir.</div></div>
<div class="exp"><h4>💧 Su (H₂O) – kullanılır</h4>
<div class="row"><span class="lbl">Nereden?</span> Topraktan kökle alınır, iletim borularıyla yaprağa taşınır.</div>
<div class="row"><span class="lbl">Görevi:</span> Işık enerjisiyle parçalanır. Buna <b>fotoliz</b> (ışıkla parçalanma) denir. Fotoliz sonucu elektron, H⁺ iyonları ve <b>O₂</b> oluşur.</div>
<div class="formula">2H₂O → O₂ + 4H⁺ + 4e⁻</div>
<div class="row">👉 Fotosentezde açığa çıkan <b>O₂'nin kaynağı sudur</b>. Glikozdaki hidrojenler de sudan gelir.</div></div>
<div class="exp"><h4>☀️ Işık – gerekli enerji</h4>
<div class="row">Fotosentezin enerji kaynağıdır. Klorofil tarafından soğurulur (emilir). Işık yoksa fotosentez olmaz.</div>
<div class="row">Işık bir madde değil, <b>enerjidir</b>.</div></div>
<div class="exp"><h4>🟢 Klorofil – gerekli pigment</h4>
<div class="row">Işığı soğuran yeşil pigmenttir (renk maddesi). Kloroplastta bulunur.</div>
<div class="row">Yapısında <b>magnezyum (Mg)</b> vardır. Yapımı için <b>demir (Fe)</b> gerekir.</div>
<div class="row">Klorofil yoksa (yaprağın beyaz bölgesi) ışık alsa bile fotosentez olmaz. Klorofil fotosentezde <b>harcanmaz</b>, gerekli bir koşuldur.</div></div>
<div class="exp"><h4>🫧 Oksijen (O₂) – üretilir</h4>
<div class="row">Suyun fotolizinden gelir. Yapraktan atmosfere verilir. Bir kısmını bitki kendi solunumunda kullanır.</div></div>
<div class="exp"><h4>🍞 Glikoz → Nişasta – üretilir</h4>
<div class="row">Glikozun fazlası yaprakta <b>nişasta</b> olarak depolanır. Glikoz ayrıca selüloz, yağ, protein ve vitamin yapımında kullanılır.</div>
<div class="row"><span class="lbl">Testi:</span> İyot damlatılır. Nişasta varsa <b>mavi-mor</b> (koyu mavi-siyah) olur. Yoksa iyodun kendi rengi olan <b>sarı-kahverengi</b> görülür.</div></div>
<h3>Özet tablo</h3>
<div class="tw"><table>
<tr><th>Kullanılan / gerekli</th><th>Üretilen</th></tr>
<tr><td>Karbondioksit (CO₂)</td><td>Glikoz (C₆H₁₂O₆) → nişasta</td></tr>
<tr><td>Su (H₂O)</td><td>Oksijen (O₂)</td></tr>
<tr><td>Işık enerjisi</td><td>(Su)</td></tr>
<tr><td>Klorofil (harcanmaz)</td><td></td></tr>
</table></div>
<h3>Atomlar nereden gelir?</h3>
<div class="tw"><table>
<tr><th>Atom</th><th>Kaynağı</th></tr>
<tr><td>Açığa çıkan O₂'deki oksijen</td><td><b>H₂O</b></td></tr>
<tr><td>Glikozdaki karbon (C)</td><td><b>CO₂</b></td></tr>
<tr><td>Glikozdaki oksijen (O)</td><td><b>CO₂</b></td></tr>
<tr><td>Glikozdaki hidrojen (H)</td><td><b>H₂O</b></td></tr>
</table></div>
<div class="box ornek"><b>💡 Örnek: İzotop deneyi</b>Bitkiye verilen suyun oksijeni işaretlenirse (ağır oksijen izotopu) açığa çıkan O₂ işaretli olur. CO₂'nin oksijeni işaretlenirse açığa çıkan O₂ işaretsizdir, işaret glikozda görülür. → O₂ sudan gelir.</div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>"Fotosentezde açığa çıkan O₂, CO₂'den gelir" → <b>Yanlış</b>. O₂'nin kaynağı <b>sudur</b> (Hill deneyi ve izotop deneyleri).</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Fotosentezde kullanılan ve üretilen maddeleri yazınız.</span>Fotosentezde karbondioksit ve su kullanılır, ışık enerjisi ve klorofil gereklidir. Glikoz ve oksijen üretilir: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. CO₂ glikozun karbon kaynağıdır. Su ışıkla parçalanır (fotoliz) ve açığa çıkan oksijenin kaynağı sudur. Glikozun fazlası nişasta olarak depolanır.</div>
</section>

<section data-id="2-3" data-unit="2" data-title="Bilim insanları ve tarihî deneyler">
<div class="tl">
<div class="ev"><span class="yr">1600'ler</span><h4>Jan Baptist van Helmont – Söğüt deneyi</h4>
<p>2,5 kg söğüt fidanını 80 kg kuru toprağa dikti, 5 yıl boyunca sadece suladı.</p>
<div class="tw"><table><tr><th></th><th>Başta</th><th>5 yıl sonra</th></tr><tr><td>Bitki</td><td>2,5 kg</td><td>75 kg</td></tr><tr><td>Kuru toprak</td><td>80 kg</td><td>79,9 kg</td></tr></table></div>
<p><b>Sonuç:</b> Bitkinin kütle artışı topraktan gelmiyor. Van Helmont artışı <b>suya</b> bağladı.</p>
<p><b>Eksik yönü:</b> Havadaki CO₂'yi hesaba katmadı. Bugün biliyoruz ki kütle artışının büyük kısmı <b>havadaki CO₂'deki karbondan</b> gelir. Topraktaki küçük azalma alınan minerallerden kaynaklanır.</p></div>
<div class="ev"><span class="yr">1771</span><h4>Joseph Priestley – Mum, fare ve bitki</h4>
<ul><li>Kapalı fanusta yanan mum bir süre sonra söner, fare bir süre sonra ölür.</li><li>Fanusa yeşil bir bitki konunca mum yanmaya, fare yaşamaya devam eder.</li></ul>
<p><b>Sonuç:</b> Bitkiler havayı "temizler", yani yanmayı ve yaşamı destekleyen gazı (O₂) üretir.</p>
<p><b>Bugünkü açıklama:</b> Mum ve fare O₂ tüketip CO₂ verir. Bitki ışıkta bu CO₂'yi kullanır ve O₂ üretir.</p></div>
<div class="ev"><span class="yr">1779</span><h4>Jan Ingenhousz – Işık gerekli</h4>
<ul><li>Su bitkileri ışıkta gaz kabarcıkları (O₂) çıkarır, karanlıkta çıkarmaz.</li><li>Fotosentez için <b>ışık gereklidir</b>.</li><li>Fotosentezi bitkinin <b>yeşil kısımları</b> yapar.</li><li>Bitkiler karanlıkta CO₂ verir (solunum).</li></ul></div>
<div class="ev"><span class="yr">1937</span><h4>Robert Hill – O₂ sudan gelir</h4>
<p>Bitki hücresinden ayrılmış kloroplastlara ışık, su ve hidrojen yakalayıcı bir madde verdi. Ortamda <b>CO₂ yoktu</b>, buna rağmen <b>O₂ oluştu</b>.</p>
<div class="formula">2H₂O → O₂ + 4H⁺ + 4e⁻<small>Hill tepkimesi</small></div>
<p><b>Sonuç:</b> Açığa çıkan O₂'nin kaynağı CO₂ değil <b>H₂O</b>'dur. O₂ ışığın kullanıldığı tepkimelerde oluşur.</p></div>
<div class="ev"><span class="yr">1946'dan itibaren · 1961 Nobel</span><h4>Melvin Calvin</h4>
<p>Radyoaktif karbon kullanarak atmosferdeki CO₂'nin glikoza (organik maddeye) nasıl dönüştürüldüğünü açıkladı. Bu tepkimelere <b>Calvin döngüsü</b> denir.</p></div>
</div>
<h3>Kim neyi gösterdi?</h3>
<div class="tw"><table>
<tr><th>Bilim insanı</th><th>Gösterdiği</th></tr>
<tr><td>Van Helmont</td><td>Bitki kütlesi topraktan gelmez (suya bağladı)</td></tr>
<tr><td>Priestley</td><td>Bitkiler havayı yenileyen gazı (O₂) üretir</td></tr>
<tr><td>Ingenhousz</td><td>Işık gerekli, yeşil kısımlar fotosentez yapar, karanlıkta CO₂ verilir</td></tr>
<tr><td>Hill</td><td>O₂'nin kaynağı sudur</td></tr>
<tr><td>Calvin</td><td>CO₂'nin glikoza dönüşüm tepkimeleri</td></tr>
</table></div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b><ul><li>Işığın gerekli olduğunu <b>Priestley değil Ingenhousz</b> gösterdi.</li><li>Van Helmont CO₂'yi bilmiyordu, sonucu tam doğru değildir.</li></ul></div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Priestley deneyinde bitkinin fareyi yaşatmasını gazlar bakımından açıklayınız.</span>Mum ve fare ortamdaki O₂'yi kullanıp CO₂ verir. Bitki ışıkta fotosentez yaparak bu CO₂'yi kullanır ve O₂ üretir (6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂). Böylece ortamdaki O₂ yenilenir ve fare yaşamaya devam eder.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Priestley deneyi karanlıkta yapılsaydı ne olurdu? Ingenhousz'un keşfiyle açıklayınız.</span>Ingenhousz fotosentez için ışığın gerekli olduğunu göstermiştir. Karanlıkta bitki fotosentez yapamaz ve O₂ üretemez. Üstelik solunumla O₂ tüketip CO₂ verir. Bu yüzden fare yaşayamazdı.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Hill'in çalışmasının bilime katkısı nedir?</span>Hill, CO₂ bulunmayan ortamda bile ışık, su ve hidrojen yakalayıcı varlığında kloroplastların O₂ oluşturduğunu göstermiştir. Bu, fotosentezde açığa çıkan O₂'nin CO₂'den değil, suyun ışıkla parçalanmasından (fotoliz) kaynaklandığını kanıtlamıştır.</div>
</section>

<section data-id="2-4" data-unit="2" data-star="1" data-title="Deney – madde eşleştirmesi (okul deneyleri)">
<div class="box ogr"><b>⭐ Öğretmenin vurguladığı</b>"Deneyler ile fotosentezi etkileyen maddeleri ilişkilendir." Bu tabloyu iyi öğren.</div>
<div class="tw wide"><table>
<tr><th>Ne gösterilir?</th><th>Deney</th><th>Sonuç</th></tr>
<tr><td><b>Işık</b> gerekli</td><td>Yaprağın bir kısmı folyoyla kapatılır</td><td>Kapalı kısımda nişasta yok</td></tr>
<tr><td><b>CO₂</b> gerekli</td><td>Fanusa KOH (CO₂ tutucu) konur</td><td>KOH'lu fanustaki bitkide nişasta yok</td></tr>
<tr><td><b>CO₂</b> gerekli (su bitkisi)</td><td>NaHCO₃'lü su ile kaynatılmış su karşılaştırılır</td><td>Kaynatılmış suda kabarcık yok</td></tr>
<tr><td><b>Klorofil</b> gerekli</td><td>Alacalı (yeşil-beyaz) yaprak</td><td>Beyaz kısımda nişasta yok</td></tr>
<tr><td><b>Su</b> gerekli</td><td>Sulanan ve sulanmayan bitki</td><td>Sulanmayan bitkide nişasta yok</td></tr>
<tr><td><b>O₂</b> üretilir</td><td>Elodea + huni + ters test tüpü</td><td>Biriken gaz kor halindeki çubuğu alevlendirir</td></tr>
<tr><td><b>Nişasta</b> üretilir</td><td>İyot testi</td><td>Mavi-mor renk</td></tr>
<tr><td><b>Işık şiddeti</b> hızı etkiler</td><td>Lamba yaklaştırılıp uzaklaştırılır</td><td>Lamba yaklaştıkça kabarcık artar</td></tr>
</table></div>

<h3>Ön hazırlık: Bitki neden önce karanlıkta bekletilir?</h3>
<p>Bitki deneyden önce 1–2 gün karanlıkta bekletilir. Karanlıkta fotosentez olmaz, yapraktaki eski nişasta parçalanıp kullanılır ve yaprak <b>nişastasız</b> kalır. Böylece deney sonunda görülen nişastanın <b>deney sırasında yapıldığından</b> emin olunur.</p>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b>Bitki karanlıkta bekletilerek yapraklarda önceden bulunan nişastanın tükenmesi sağlanır. Böylece deney sonunda iyotla tespit edilen nişastanın deney süresince yapılan fotosentezden kaynaklandığı anlaşılır.</div>

<h3>İyot testi nasıl yapılır?</h3>
<ol class="steps">
<li><b>Haşlama:</b> Yaprak kaynar suda birkaç dakika bekletilir. Hücreler ölür, zarlar parçalanır, iyot içeri girebilir.</li>
<li><b>Alkolde bekletme:</b> Yaprak su banyosundaki sıcak alkole konur. Klorofil alkolde çözünür, yaprağın rengi açılır, renk değişimi kolay görülür. (Alkol yanıcı olduğu için doğrudan ateşte ısıtılmaz.)</li>
<li><b>Yıkama:</b> Alkolün sertleştirdiği yaprak suyla yıkanıp yumuşatılır.</li>
<li><b>İyot damlatma:</b> Nişasta varsa mavi-mor, yoksa sarı-kahverengi.</li>
</ol>

<h3>☀️ Işık: Folyo deneyi</h3>
<p>Karanlıkta bekletilen bitkinin bir yaprağının ortası alüminyum folyoyla kapatılır. Bitki birkaç saat güneşte bırakılır, sonra yaprağa iyot testi yapılır.</p>
<h3>🟢 Klorofil: Alacalı yaprak deneyi</h3>
<p>Yeşil-beyaz alacalı yapraklı bitki ışıkta bekletilir, sonra yaprağa iyot testi yapılır.</p>

<h3>🌬️ CO₂: KOH deneyi</h3>
<p>Karanlıkta bekletilmiş iki özdeş bitki iki cam fanusa konur. Fanuslardan birine <b>KOH</b> (potasyum hidroksit) konur. KOH havadaki CO₂'yi tutar. NaOH ve Ca(OH)₂ de aynı işi yapar. İki fanus ışıkta bekletilir, yapraklara iyot testi yapılır.</p>
<div class="tw"><table><tr><th>Fanus</th><th>CO₂</th><th>İyot sonucu</th></tr><tr><td>KOH'lu</td><td>Yok</td><td>Sarı-kahverengi (nişasta yok)</td></tr><tr><td>Normal</td><td>Var</td><td>Mavi-mor (nişasta var)</td></tr></table></div>
<p><b>Sonuç:</b> Fotosentez için <b>CO₂ gereklidir</b>.</p>
<div class="box ornek"><b>💡 Su bitkisi versiyonu</b><b>Sodyum bikarbonat (NaHCO₃)</b> suya CO₂ verir. <b>Kaynatılıp soğutulmuş</b> sudaki CO₂ ise kaynatma sırasında uçar. Işıkta NaHCO₃'lü sudaki bitki kabarcık çıkarır, kaynatılmış sudaki bitki çıkarmaz. → CO₂ gerekli.</div>

<h3>💧 Su deneyi</h3>
<p>İki özdeş bitkiden birine düzenli su verilir, diğerine verilmez. Işıkta bekletilir, iyot testi yapılır. Sulanmayan bitkide nişasta oluşmaz. → <b>Su gerekli</b>.</p>
<div class="box tuzak"><b>⚠️ Dikkat</b>Su azlığında yapraktaki gözenekler (stomalar) da kapanır ve CO₂ girişi azalır. Bu yüzden su eksikliği fotosentezi iki yoldan yavaşlatır.</div>

<h3>🫧 O₂: Elodea (su veba otu) deneyi</h3>

<li>Tüpe <b>kor halindeki (közlenmiş) çubuk</b> sokulur, çubuk <b>alevlenir</b> → gaz <b>O₂</b>'dir.</li>

<p>Karanlıkta bekletilen düzenekte kabarcık oluşmaz. → Işık gerekli.</p>

<h3>💡 Işık şiddeti deneyi</h3>
<p>Lamba bitkiye farklı uzaklıklara konur, belirli sürede çıkan kabarcıklar sayılır. Lamba yaklaştıkça <b>ışık şiddeti artar</b>.</p>

<p><b>Sonuç:</b> Işık şiddeti arttıkça fotosentez hızı artar.</p>
<div class="box ornek"><b>💡 Örnek: Üç tüp karşılaştırması</b>

<ul><li><b>X–Y:</b> Tek fark CO₂ → <b>CO₂ gerekli</b>.</li><li><b>X–Z:</b> Tek fark ışık → <b>ışık gerekli</b>.</li><li><b>Y–Z karşılaştırılmaz:</b> İki koşul birden farklı (hem CO₂ hem ışık).</li><li>Z tüpü ışığa konursa CO₂ olduğu için fotosentez başlar ve kabarcık çıkar.</li></ul></div>
</section>

<section data-id="2-5" data-unit="2" data-title="Deney kurmanın kuralları: değişkenler">
<h3>Temel kavramlar</h3>
<div class="tw"><table>
<tr><th>Kavram</th><th>Anlamı</th></tr>
<tr><td><b>Bağımsız değişken</b></td><td>Deneyi yapanın <b>bilerek değiştirdiği</b> tek faktör (neden)</td></tr>
<tr><td><b>Bağımlı değişken</b></td><td>Bağımsız değişkene bağlı olarak değişen, <b>ölçülen</b> sonuç</td></tr>
<tr><td><b>Kontrol (sabit) değişkenler</b></td><td>Bütün düzeneklerde <b>aynı tutulan</b> faktörler</td></tr>
<tr><td><b>Kontrol grubu</b></td><td>Koşulların normal bırakıldığı, karşılaştırma için kullanılan grup</td></tr>
<tr><td><b>Deney grubu</b></td><td>Bağımsız değişkenin uygulandığı grup</td></tr>
<tr><td><b>Hipotez</b></td><td>Deneyle test edilebilen tahmin</td></tr>
</table></div>
<h3>Deneylere uygulama</h3>
<div class="tw wide"><table>
<tr><th>Deney</th><th>Bağımsız</th><th>Bağımlı</th><th>Sabit tutulanlar</th></tr>
<tr><td>Folyo</td><td>Işık var / yok</td><td>Nişasta (iyot rengi)</td><td>Aynı yaprak, süre, sıcaklık, CO₂</td></tr>
<tr><td>KOH</td><td>CO₂ var / yok</td><td>Nişasta</td><td>Bitki türü ve büyüklüğü, ışık, süre, sıcaklık, su</td></tr>
<tr><td>Alacalı yaprak</td><td>Klorofil var / yok</td><td>Nişasta</td><td>Aynı yaprak, ışık, süre</td></tr>

<tr><td>Işıklı / karanlık Elodea</td><td>Işığın varlığı</td><td>Kabarcık sayısı</td><td>Sıcaklık, NaHCO₃, bitki büyüklüğü, süre</td></tr>
</table></div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b><ul><li>Bir deneyde <b>sadece bir</b> değişken değiştirilir. İki koşul birden değişirse sonucun hangisinden kaynaklandığı anlaşılamaz.</li><li>Lamba ısı da verir. Işık şiddeti deneyinde <b>sıcaklık sabit tutulmalıdır</b>, yoksa sonuç sıcaklıktan da etkilenir.</li></ul></div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Deneyin amacını, bağımlı ve bağımsız değişkenini yazınız.</span><b>Amaç:</b> Işık şiddetinin fotosentez hızına etkisini araştırmak.<br><b>Bağımsız değişken:</b> Işık kaynağının bitkiye uzaklığı (ışık şiddeti).<br><b>Bağımlı değişken:</b> Belirli sürede oluşan gaz kabarcığı sayısı.<br><b>Kontrol değişkenleri:</b> Sıcaklık, bitki türü ve büyüklüğü, CO₂ miktarı, süre.</div>
<div class="box akil"><b>🧠 Akılda kalsın</b>Amaç cümlesi kalıbı: "<b>___'nın fotosentez hızına etkisini araştırmak</b>." Boşluğa bağımsız değişken yazılır.</div>
</section>

<section data-id="2-6" data-unit="2" data-title="Fotosentezi etkileyen faktörler">
<p><b>Fotosentez hızı nasıl ölçülür?</b> Birim zamanda çıkan O₂ (kabarcık sayısı), kullanılan CO₂ miktarı ya da oluşan nişasta/glikoz miktarı ölçülür.</p>
<div class="mini3">
<div><svg viewBox="0 0 110 85"><line x1="12" y1="70" x2="105" y2="70" stroke="#888"/><line x1="12" y1="70" x2="12" y2="6" stroke="#888"/><path d="M12 70 Q45 18 70 22 L102 22" fill="none" stroke="#15934a" stroke-width="3"/><text x="58" y="82" font-size="8" text-anchor="middle" class="t-m">ışık şiddeti</text></svg>Işık şiddeti</div>
<div><svg viewBox="0 0 110 85"><line x1="12" y1="70" x2="105" y2="70" stroke="#888"/><line x1="12" y1="70" x2="12" y2="6" stroke="#888"/><path d="M12 70 L62 22 L102 22" fill="none" stroke="#3b82f6" stroke-width="3"/><text x="58" y="82" font-size="8" text-anchor="middle" class="t-m">CO₂ miktarı</text></svg>CO₂ miktarı</div>
<div><svg viewBox="0 0 110 85"><line x1="12" y1="70" x2="105" y2="70" stroke="#888"/><line x1="12" y1="70" x2="12" y2="6" stroke="#888"/><path d="M12 66 Q50 40 66 14 Q76 30 90 70" fill="none" stroke="#d62828" stroke-width="3"/><text x="58" y="82" font-size="8" text-anchor="middle" class="t-m">sıcaklık</text></svg>Sıcaklık</div>
</div>
<p style="text-align:center;font-size:.85em;color:var(--muted)">Dikey eksen: fotosentez hızı</p>
<div class="tw wide"><table>
<tr><th>Faktör</th><th>Etkisi</th><th>İlgili deney</th></tr>
<tr><td><b>Işık şiddeti</b></td><td>Arttıkça hız artar, bir noktadan sonra sabitlenir. Işık yoksa fotosentez olmaz.</td><td>Lamba mesafesi, folyo</td></tr>
<tr><td><b>Işığın rengi</b></td><td>Klorofil en çok mor-mavi ve kırmızı ışığı soğurur, bu ışıklarda hız yüksektir. Yeşil ışıkta hız en düşüktür.</td><td>Farklı renkli ışık altında kabarcık sayma</td></tr>
<tr><td><b>CO₂ miktarı</b></td><td>Arttıkça hız belli bir değere kadar artar, sonra sabitlenir. CO₂ tutucu (KOH, NaOH, Ca(OH)₂) varsa hız düşer.</td><td>KOH, NaHCO₃ / kaynatılmış su</td></tr>
<tr><td><b>Sıcaklık</b></td><td>Fotosentez tepkimeleri enzimlerle yürür. Uygun (optimum) sıcaklığa kadar hız artar. Daha yüksek sıcaklıkta enzimlerin yapısı bozulur, hız düşer ve durur.</td><td>Farklı sıcaklıkta su banyosu</td></tr>
<tr><td><b>Su</b></td><td>Azsa fotoliz yavaşlar, stomalar kapanır ve CO₂ girişi azalır.</td><td>Sulanan / sulanmayan bitki</td></tr>
<tr><td><b>Klorofil miktarı</b></td><td>Arttıkça hız artar.</td><td>Alacalı yaprak</td></tr>
<tr><td><b>Mineraller</b></td><td>Mg klorofilin yapısında, Fe klorofil yapımında gerekir, N da gereklidir. Eksikliğinde yapraklar sararır.</td><td>–</td></tr>
<tr><td><b>pH</b></td><td>Enzimler belirli pH aralığında çalışır.</td><td>–</td></tr>
</table></div>
<div class="box akil"><b>🧠 Akılda kalsın: Sınırlayıcı faktör (minimum kuralı)</b>Fotosentez hızını <b>en yetersiz olan</b> faktör belirler. Örnek: Işık çok ama CO₂ azsa, ışığı artırmak hızı artırmaz, CO₂'yi artırmak gerekir.</div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>Grafikte çizginin düzleşmesi "fotosentez durdu" demek <b>değildir</b>. Hız artık artmıyor ama aynı hızda devam ediyor. Başka bir faktör sınırlayıcı olmuştur.</div>
<div class="box ornek"><b>💡 Bağlantı</b>Bugün konuştuğumuz konu: Görünür ışıkta mor ışığın dalga boyu en kısa, enerjisi en fazladır. Kırmızının dalga boyu en uzun, enerjisi en azdır. Klorofil ikisini de iyi soğurur, yeşili ise yansıtır. Yaprak bu yüzden yeşil görünür.</div>
</section>

<section data-id="2-7" data-unit="2" data-title="Hızlı tekrar: Fotosentez">
<ul class="qr">
<li>🌿 Fotosentez: ışık enerjisiyle CO₂ ve H₂O'dan glikoz yapımı. Kloroplastta gerçekleşir.</li>
<li>🧪 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (ışık, klorofil)</li>
<li>⬅️ Kullanılan: CO₂, H₂O. ⚙️ Gerekli: ışık, klorofil, enzim. ➡️ Üretilen: glikoz (→ nişasta), O₂</li>
<li>💧 O₂ sudan gelir (fotoliz). 🌬️ Glikozdaki C ve O, CO₂'den gelir.</li>
<li>🔄 Işık enerjisi → kimyasal enerji. Fotosentez endergoniktir.</li>
<li>🌙 Bitkiler gece de solunum yapar. Karanlıkta CO₂ verirler.</li>
<li>🌳 Van Helmont: kütle topraktan gelmez. 🕯️ Priestley: bitki havayı yeniler (O₂). 💡 Ingenhousz: ışık gerekli, yeşil kısımlar. 💧 Hill: O₂ sudan. 🔁 Calvin: CO₂ → glikoz.</li>
<li>🌑 Deneyden önce karanlıkta bekletme: eski nişastayı tüketmek için.</li>
<li>🟫 Folyo → ışık. 🧂 KOH → CO₂. 🍃 Alacalı → klorofil. 🚱 Susuz bitki → su. 🫧 Elodea + kor çubuk → O₂. 🟦 İyot → nişasta.</li>
<li>🔵 İyot: nişasta varsa mavi-mor, yoksa sarı-kahverengi.</li>
<li>📏 Bağımsız: değiştirilen. Bağımlı: ölçülen. Sabitler: aynı tutulanlar. Tek seferde tek değişken.</li>
<li>📈 Işık ve CO₂: artar → sabitlenir. 🌡️ Sıcaklık: artar → optimum → düşer (enzim bozulur).</li>
<li>⛓️ Hızı en yetersiz faktör belirler (sınırlayıcı faktör).</li>
</ul>
</section>

<!-- ===================== ÜNİTE 3 ===================== -->
<section data-id="3-1" data-unit="3" data-title="Sindirim nedir? Mekanik ve kimyasal sindirim">
<p class="lead"><b>Sindirim:</b> Karbonhidrat, protein ve yağ gibi büyük moleküllü besinlerin, <b>hücre zarından geçebilecek kadar küçük yapı taşlarına</b> parçalanmasıdır.</p>
<p><b>Neden gerekli?</b> Büyük moleküller hücre zarından geçemez. Hücreye girip enerji üretimi, yapım ve onarımda kullanılabilmeleri için önce küçültülmeleri gerekir.</p>
<div class="chain"><span>Besinin alınması</span><em>→</em><span>Sindirim</span><em>→</em><span>Emilim</span><em>→</em><span>Atıkların atılması</span></div>
<h3>Yapılış biçimine göre</h3>
<div class="grid2">
<div class="gcard"><h4>⚙️ Mekanik (fiziksel) sindirim</h4><ul><li>Besin <b>kimyasal yapısı değişmeden</b> küçük parçalara ayrılır.</li><li><b>Enzim kullanılmaz</b>.</li><li>Yüzey alanını artırır, kimyasal sindirimi kolaylaştırır.</li><li>Örnek: dişlerle çiğneme, midenin kas hareketleri, kuşlarda taşlığın öğütmesi, safranın yağları küçük damlacıklara ayırması</li></ul></div>
<div class="gcard"><h4>🧪 Kimyasal sindirim</h4><ul><li>Besinler <b>enzim ve su</b> kullanılarak yapı taşlarına ayrılır. Buna <b>hidroliz</b> denir.</li><li>Besinin kimyasal yapısı değişir.</li></ul></div>
</div>
<div class="tw"><table>
<tr><th>Besin</th><th>Kimyasal sindirim sonucu</th></tr>
<tr><td>Karbonhidrat (nişasta)</td><td>Monosakkarit (glikoz)</td></tr>
<tr><td>Protein</td><td>Amino asit</td></tr>
<tr><td>Yağ</td><td>Yağ asidi + gliserol</td></tr>
</table></div>
<h3>Gerçekleştiği yere göre</h3>
<div class="chips"><span>🔵 Hücre içi sindirim</span><span>🟢 Hücre dışı sindirim</span><span>🟣 Karma sindirim</span></div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b><ul><li><b>Safra enzim içermez</b>. Yağları sindirmez, sadece küçük damlacıklara ayırır (mekanik).</li><li>Kimyasal sindirim hidrolizdir, yani <b>su harcanır</b>. ATP'nin defosforilasyonunda da su harcanır.</li></ul></div>
</section>

<section data-id="3-2" data-unit="3" data-title="Hücre içi sindirim">
<p class="lead"><b>Hücre içi sindirim:</b> Besinin hücre içine alındıktan sonra, hücrenin içinde <b>lizozom enzimleriyle</b> sindirilmesidir.</p>
<h3>Aşamaları</h3>
<ol class="steps">
<li><b>Hücre içine alma:</b> Besin endositozla (hücre zarının besini sararak içeri alması) hücreye alınır. Katı besin söz konusuysa buna fagositoz denir. <b>Besin kofulu</b> oluşur.</li>
<li><b>Lizozomla birleşme:</b> Besin kofulu, sindirim enzimleri taşıyan <b>lizozom</b> ile birleşir. <b>Sindirim kofulu</b> oluşur.</li>
<li><b>Sindirim:</b> Lizozom enzimleri besini hidrolizle parçalar.</li>
<li><b>Geçiş:</b> Oluşan küçük moleküller sitoplazmaya geçer ve kullanılır.</li>
<li><b>Atma:</b> Sindirilemeyen artıklar ekzositozla (zarla dışarı atma) hücre dışına atılır.</li>
</ol>
<h3>Görüldüğü canlılar</h3>
<div class="chips"><span>🦠 Amip</span><span>🦠 Paramesyum</span><span>🧽 Süngerlerin yaka hücreleri</span><span>🪼 Hidra (karma sindirimin ikinci aşaması)</span><span>🩸 İnsanda akyuvarlar</span></div>
<div class="box ornek"><b>💡 Örnek: Akyuvar</b>Akyuvar bir bakteriyi yakalar (fagositoz) → besin kofulu (fagozom) oluşur → lizozomla birleşir → bakteri enzimlerle parçalanır → artıklar dışarı atılır. Burada amaç beslenme değil <b>savunmadır</b> ama olay hücre içi sindirimdir.</div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>Hücre içi sindirimde sadece <b>hücreye sığabilecek küçük besinler</b> sindirilebilir. Bu, hücre içi sindirimin en büyük dezavantajıdır.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Akyuvarın bakteriyi yok etmesindeki hücre içi sindirim aşamalarını sırasıyla yazınız.</span>1) Bakteri fagositozla hücre içine alınır ve besin kofulu oluşur. 2) Besin kofulu lizozomla birleşerek sindirim kofulunu oluşturur. 3) Lizozom enzimleri bakteriyi hidrolizle parçalar. 4) Oluşan küçük moleküller sitoplazmaya geçer. 5) Artık maddeler ekzositozla hücre dışına atılır.</div>
</section>

<section data-id="3-3" data-unit="3" data-title="Hücre dışı ve karma sindirim">
<h3>Hücre dışı sindirim</h3>
<p>Sindirim enzimleri <b>hücre dışına salgılanır</b>. Besin hücrenin dışında parçalanır, oluşan küçük moleküller hücre içine emilir.</p>
<div class="chips"><span>🍄 Mantarlar (şapkalı mantar, küf)</span><span>🦠 Çürükçül bakteriler</span><span>🪱 Toprak solucanı, böcekler</span><span>🐦 Omurgalılar</span><span>🧍 İnsan (ağız, mide, ince bağırsak)</span></div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>"Hücre dışı" <b>vücudun dışı</b> demek değildir. Sindirim kanalı vücudun içindedir ama <b>hücrelerin dışındadır</b>. İnsanın midesinde ve ince bağırsağında olan sindirim hücre dışı sindirimdir.</div>
<h3>Hücre dışı sindirimin avantajı</h3>
<ul>
<li>Hücreden <b>çok daha büyük besinler</b> de sindirilebilir.</li>
<li>Canlı daha büyük ve çeşitli besin kaynaklarından yararlanır. Bu durum büyük vücutlu çok hücreli canlıların ortaya çıkmasını kolaylaştırmıştır.</li>
<li>Mantar ve bakteriler ölü canlıları ayrıştırarak maddelerin doğaya geri dönmesini sağlar.</li>
</ul>
<h3>Karma sindirim</h3>
<p>Sindirim önce <b>hücre dışında</b> (sindirim boşluğunda) başlar, parçalar hücrelere alınır ve <b>hücre içinde</b> tamamlanır.</p>
<div class="chips"><span>🪼 Hidra</span><span>🪱 Planarya</span></div>
<div class="box tuzak"><b>⚠️ Kaynaklar arasında fark</b>Bazı notlarda "insan, kuş ve memeliler karma sindirim yapar" yazar. Ders kitaplarının çoğunda ise omurgalılar ve insan <b>hücre dışı</b> sindirim yapan canlılar olarak geçer. Sınavda öğretmeninizin anlattığını esas alın.</div>
<h3>Karşılaştırma</h3>
<div class="tw"><table>
<tr><th></th><th>Hücre içi</th><th>Hücre dışı</th></tr>
<tr><td>Nerede?</td><td>Hücre içinde, sindirim kofulunda</td><td>Hücre dışında (sindirim kanalı veya ortam)</td></tr>
<tr><td>Enzimler</td><td>Lizozomda, hücre içinde kalır</td><td>Hücre dışına salgılanır</td></tr>
<tr><td>Besin büyüklüğü</td><td>Küçük olmalı</td><td>Büyük olabilir</td></tr>
<tr><td>Örnek</td><td>Amip, paramesyum, akyuvar</td><td>Mantar, bakteri, insan</td></tr>
</table></div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Amip ve şapkalı mantarın sindirim çeşitlerini açıklayınız.</span><b>Amip:</b> Hücre içi sindirim yapar. Besini besin kofulu içine alır, koful lizozomla birleşir ve besin hücre içinde parçalanır.<br><b>Şapkalı mantar:</b> Hücre dışı sindirim yapar. Enzimlerini dış ortama salgılar, büyük moleküller hücre dışında parçalanır ve küçük moleküller hücre içine alınır.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Hücre dışı sindirimin hücre içi sindirime göre avantajı nedir?</span>Hücre dışı sindirimde enzimler dışarı salgılandığı için hücreden büyük besinler de parçalanabilir. Oluşan küçük moleküller hücreye alınır. Böylece canlı daha büyük ve çeşitli besin kaynaklarından yararlanabilir.</div>
</section>

<section data-id="3-4" data-unit="3" data-title="Canlı gruplarında sindirim ve omurgasız yapıları">
<h3>Canlı gruplarına göre sindirim</h3>
<div class="tw"><table>
<tr><th>Canlı grubu</th><th>Sindirim çeşidi</th><th>Örnek</th></tr>
<tr><td>Bakteriler</td><td>Hücre dışı</td><td>Çürükçül bakteriler</td></tr>
<tr><td>Protistler</td><td>Hücre içi</td><td>Amip, paramesyum</td></tr>
<tr><td>Mantarlar</td><td>Hücre dışı</td><td>Şapkalı mantar, küf</td></tr>
<tr><td>Bitkiler</td><td>Besinini fotosentezle ürettiği için sindirim sistemi yoktur</td><td>Yeşil bitkiler</td></tr>
<tr><td>Süngerler</td><td>Hücre içi</td><td>Sünger</td></tr>
<tr><td>Hidra, planarya</td><td>Karma</td><td>Hidra</td></tr>
<tr><td>Toprak solucanı, böcekler</td><td>Hücre dışı</td><td>Solucan</td></tr>
<tr><td>Omurgalılar</td><td>Hücre dışı</td><td>Balık, kuş, memeli, insan</td></tr>
</table></div>
<h3>🧽 Sünger</h3>
<ul><li>Sindirim kanalı ve sindirim boşluğu <b>yoktur</b>.</li><li>Su küçük deliklerden (ostium) girer, büyük delikten (oskulum) çıkar.</li><li>Sudaki besinleri yaka hücreleri yakalar ve <b>hücre içinde</b> sindirir.</li></ul>
<h3>🪼 Hidra</h3>
<ul><li><b>Tek açıklıklı</b> sindirim boşluğu vardır (gastrovasküler boşluk). Ağız hem giriş hem çıkıştır.</li><li>Tentaküllerle (dokunaç) yakalanan besin ağızdan alınır.</li><li>Boşlukta salgılanan enzimlerle kısmen sindirilir (hücre dışı), parçalar hücrelere alınıp sindirim tamamlanır (hücre içi) → <b>karma sindirim</b>.</li><li>Artıklar yine ağızdan atılır.</li></ul>
<h3>🪱 Toprak solucanı</h3>
<p><b>İki açıklıklı</b>, tam bir sindirim kanalı vardır:</p>
<div class="chain"><span>Ağız</span><em>→</em><span>Yutak</span><em>→</em><span>Yemek borusu</span><em>→</em><span class="hl">Kursak</span><em>→</em><span class="hl">Taşlık</span><em>→</em><span>Bağırsak</span><em>→</em><span>Anüs</span></div>
<p>Kursak besini depolar, taşlık öğütür. Kuşlardaki yapılara benzer.</p>
<div class="box akil"><b>🧠 Akılda kalsın</b><ul><li><b>Tek açıklıklı</b> (hidra): ağız hem giriş hem çıkış.</li><li><b>İki açıklıklı</b> (solucan, insan): besin ağızdan girer, artık anüsten çıkar. Besin tek yönde ilerler, kanalın her bölümü ayrı bir işte uzmanlaşır.</li></ul></div>
</section>

<section data-id="3-5" data-unit="3" data-title="Kuşlarda sindirim">
<p>Kuşlarda <b>diş ve çene yoktur</b>, ağız sert bir <b>gaga</b> biçimindedir.</p>
<h3>Kuşlarda sindirim kanalı</h3>
<div class="chain"><span>Ağız (gaga)</span><em>→</em><span>Yutak</span><em>→</em><span>Yemek borusu</span><em>→</em><span class="hl">Kursak</span><em>→</em><span class="hl">Bezli mide</span><em>→</em><span class="hl">Kaslı mide (taşlık)</span><em>→</em><span>İnce bağırsak</span><em>→</em><span>Kalın bağırsak</span><em>→</em><span class="hl">Kloak</span></div>
<div class="exp"><h4>🫙 Kursak</h4><div class="row">Yemek borusunun genişlemiş kısmıdır. Besinler burada bir süre <b>depolanır ve yumuşar</b>.</div></div>
<div class="exp"><h4>🧪 Bezli mide</h4><div class="row">Sindirim enzimleri ve asit salgılanır. <b>Proteinlerin kimyasal sindirimi burada başlar</b>.</div></div>
<div class="exp"><h4>💪 Kaslı mide (taşlık)</h4><div class="row">Kalın ve güçlü kaslı duvarı vardır. Kuşun yuttuğu küçük taş ve kum taneleri de yardım eder. Besinleri <b>öğüterek mekanik sindirim</b> yapar. <b>Dişlerin görevini üstlenir.</b></div></div>
<div class="exp"><h4>🚪 Kloak</h4><div class="row"><b>Sindirim, boşaltım ve üreme</b> sistemlerinin ortak açıldığı odacıktır. Kloak açıklığı ile vücut dışına açılır.</div></div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b><ul><li>Taşlık <b>mekanik</b> sindirim yapar, kimyasal değil.</li><li>Sıra: <b>Önce bezli mide, sonra taşlık</b>.</li><li>Kursak sindirim yapmaz, depolar ve yumuşatır.</li></ul></div>
<div class="box ornek"><b>💡 Bilgi</b>Diş ve ağır çene kemiklerinin olmaması kuşun vücudunu hafifletir, bu da uçmaya uyum sağlar.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Kuşlarda dişlerin görevini üstlenen yapı hangisidir, besini nasıl parçalar?</span>Kuşlarda dişlerin görevini kaslı mide (taşlık) üstlenir. Taşlığın güçlü kas yapısı ve içindeki küçük taşlar besinleri öğüterek fiziksel olarak parçalar ve mekanik sindirim sağlar. Kursak ise besinin geçici olarak depolanıp yumuşamasına yardım eder.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Kuşlarda sindirim, üreme ve boşaltım sistemlerinin dışarı açıldığı ortak açıklığın adı nedir?</span>Kloak.</div>
</section>

<section data-id="3-6" data-unit="3" data-title="Memelilerde diş ve mide yapısı">
<h3>Diş çeşitleri</h3>
<div class="tw"><table>
<tr><th>Diş</th><th>Görevi</th></tr>
<tr><td><b>Kesici</b> (önde)</td><td>Koparma, kesme</td></tr>
<tr><td><b>Köpek</b> (sivri)</td><td>Yırtma, delme</td></tr>
<tr><td><b>Azı</b> (arkada)</td><td>Öğütme, çiğneme</td></tr>
</table></div>
<h3>Beslenmeye göre diş yapısı</h3>
<div class="tw wide"><table>
<tr><th>Etçil</th><th>Otçul</th><th>Hepçil</th></tr>
<tr><td>Avı yakalamaya, eti koparmaya ve parçalamaya uygun. <b>Sivri köpek dişleri</b>, keskin kesiciler ve parçalayıcı azılar belirgindir.</td><td>Bitkileri öğütmeye uygun <b>geniş yüzeyli azı dişleri</b> gelişmiştir. Bazılarında köpek dişi bulunmaz.</td><td>Hem bitkisel hem hayvansal besin yer. Üç diş çeşidi dengeli, <b>karma</b> diş yapısı vardır.</td></tr>
<tr><td>Kurt, kaplan, kedi</td><td>İnek, koyun, at, tavşan</td><td>İnsan, ayı</td></tr>
</table></div>
<h3>Mide yapısı</h3>
<p><b>Tek bölmeli mide:</b> insan, kurt, kaplan, kedi, at, tavşan</p>
<p><b>Dört bölmeli mide:</b> Geviş getiren otçullar (inek, koyun, keçi). Bölümler: <b>işkembe, börkenek, kırkbayır, şirden</b>.</p>
<h3>Geviş getirenlerde besinin yolu</h3>
<div class="chain"><span>Ağız</span><em>→</em><span>Yemek borusu</span><em>→</em><span class="hl">İşkembe</span><em>→</em><span class="hl">Börkenek</span><em>→</em><span class="hl2">Tekrar ağız (geviş)</span><em>→</em><span>Yemek borusu</span><em>→</em><span class="hl">Kırkbayır</span><em>→</em><span class="hl">Şirden</span><em>→</em><span>İnce bağırsak</span></div>
<div class="tw"><table>
<tr><th>Bölüm</th><th>Görevi</th></tr>
<tr><td><b>İşkembe ve börkenek</b></td><td>Besin geçici olarak depolanır. Buradaki <b>mikroorganizmaların</b> (bakteri, protist) enzimleri <b>selülozu</b> parçalar.</td></tr>
<tr><td><b>Geviş getirme</b></td><td>Besin börkenekten ağza geri gelir ve yeniden çiğnenir. Mekanik sindirim artar.</td></tr>
<tr><td><b>Kırkbayır</b></td><td>Suyun ve bazı çözünmüş maddelerin bir kısmı emilir.</td></tr>
<tr><td><b>Şirden</b></td><td>Hayvanın <b>kendi sindirim enzimleriyle</b> sindirim devam eder (gerçek mide).</td></tr>
</table></div>
<div class="box ornek"><b>💡 Neden mikroorganizma gerekli?</b>Selüloz bitki hücre çeperinin ana maddesidir. Memeliler selülozu sindiren enzimi <b>üretemez</b>. İşkembede yaşayan mikroorganizmalar bu enzimi üretir. Hayvan mikroorganizmaya besin ve uygun ortam sağlar, mikroorganizma selülozu sindirir. İkisi de kazançlıdır (karşılıklı yarar).</div>
<div class="box tuzak"><b>⚠️ Sınav tuzağı</b>İneğin "4 midesi" yoktur, tek midesi <b>4 bölmelidir</b>. Kendi enzimlerini salgılayan gerçek mide <b>şirdendir</b>.</div>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Dört bölmeli midenin bitkisel beslenmeye sağladığı avantajı açıklayınız.</span>İşkembe ve börkenekte yaşayan mikroorganizmalar, ürettikleri enzimlerle hayvanın kendi enzimleriyle sindiremediği selülozun parçalanmasını sağlar. Ayrıca geviş getirme sırasında besinin yeniden çiğnenmesi mekanik sindirimi artırır. Böylece bitkisel besinlerden daha fazla yararlanılır.</div>
</section>

<section data-id="3-7" data-unit="3" data-title="Bağırsak uzunluğu ve genel karşılaştırma">
<h3>Bağırsak uzunluğu</h3>
<ul>
<li>Otçulların bağırsağı vücut büyüklüğüne oranla <b>uzun</b>, etçillerinki <b>kısadır</b>.</li>
<li><b>Neden?</b> Bitkisel besinler selüloz içerdiği için zor ve yavaş sindirilir. Hayvansal besinler protein ve yağca zengindir, kolay ve hızlı sindirilir.</li>
<li><b>Uzun bağırsak</b>, sindirim için <b>daha fazla zaman</b> ve emilim için <b>daha geniş yüzey</b> sağlar.</li>
<li>At ve tavşan gibi geviş getirmeyen otçullarda <b>kör bağırsak (çekum)</b> gelişmiştir. Buradaki mikroorganizmalar selüloz sindirimine yardım eder.</li>
</ul>
<h3>Genel karşılaştırma</h3>
<div class="tw wide"><table>
<tr><th>Özellik</th><th>Etçil</th><th>Otçul</th><th>Hepçil</th><th>Kuş</th></tr>
<tr><td>Dişler</td><td>Sivri köpek dişi, keskin azılar</td><td>Geniş öğütücü azılar, köpek dişi küçük ya da yok</td><td>Üç çeşit dengeli</td><td>Diş yok, gaga</td></tr>
<tr><td>Mide</td><td>Tek bölmeli</td><td>Geviş getirende 4 bölmeli (at ve tavşanda tek)</td><td>Tek bölmeli</td><td>Bezli mide + taşlık</td></tr>
<tr><td>Bağırsak</td><td>Kısa</td><td>Uzun</td><td>Orta</td><td>Kısa</td></tr>
<tr><td>Örnek</td><td>Kurt, kaplan</td><td>İnek, koyun</td><td>İnsan</td><td>Tavuk, güvercin</td></tr>
</table></div>
<h3>Canlıyı tanıma ipuçları</h3>
<ul class="qr">
<li>🦷 Diş yok, kursak ve taşlık var → <b>kuş</b></li>
<li>🐄 Dört bölmeli mide, uzun bağırsak → <b>geviş getiren otçul</b> (inek, koyun)</li>
<li>🐺 Sivri köpek dişleri, kısa bağırsak, tek bölmeli mide → <b>etçil</b> (kurt, kaplan)</li>
<li>🧍 Kesici, köpek ve azı dişlerinin hepsi var, tek bölmeli mide → <b>hepçil</b> (insan)</li>
</ul>
<div class="box yaz"><b>✍️ Yazılıda böyle yaz</b><span class="q">Soru: Kaplan ile koyunun mide ve bağırsak farkını besinlerin sindirim zorluğuyla açıklayınız.</span>Kaplan etçildir. Hayvansal besinler protein ve yağca zengin olup kolay ve hızlı sindirildiği için kısa bağırsak ve tek bölmeli basit mide yeterlidir. Koyun otçuldur. Bitkisel besinler selüloz içerdiği için sindirimi zordur. Dört bölmeli midesindeki mikroorganizmalar selülozun sindirimine yardım eder. Uzun bağırsağı sindirim için daha fazla zaman ve emilim için daha geniş yüzey sağlar.</div>
</section>

<section data-id="3-8" data-unit="3" data-title="Hızlı tekrar: Sindirim">
<ul class="qr">
<li>🍽️ Sindirim: büyük besinleri hücre zarından geçebilecek küçük yapı taşlarına ayırma</li>
<li>⚙️ Mekanik: enzim yok, yapı değişmez, yüzey alanı artar. 🧪 Kimyasal: enzim + su (hidroliz)</li>
<li>🍞 Nişasta → glikoz · 🥩 Protein → amino asit · 🧈 Yağ → yağ asidi + gliserol</li>
<li>🟡 Safra enzim içermez, yağı damlacıklara ayırır (mekanik).</li>
<li>🔵 Hücre içi: besin kofulu + lizozom → sindirim kofulu → parçalanma → artık ekzositozla dışarı (amip, paramesyum, akyuvar)</li>

<li>🐦 Kuş: kursak (depo) → bezli mide (enzim, asit) → taşlık (öğütme, mekanik) → … → kloak (ortak açıklık)</li>

<li>🐄 Geviş getiren: işkembe → börkenek → ağız → kırkbayır → şirden. Selülozu mikroorganizmalar sindirir.</li>
<li>📏 Otçulun bağırsağı uzun (selüloz zor sindirilir), etçilin bağırsağı kısa.</li>
</ul>

  var q=document.getElementById('q'),sl=document.getElementById('sl');
  function norm(t){return t.toLocaleLowerCase('tr');}
  function draw(){var v=norm(q.value.trim());var h='';
    S.forEach(function(e){if(!v||norm(e[0]).indexOf(v)>-1||norm(e[1]).indexOf(v)>-1)h+='<div class="term"><b>'+esc(e[0])+'</b><span>'+esc(e[1])+'</span></div>';});
    sl.innerHTML=h||'<p style="color:var(--muted)">Sonuç bulunamadı.</p>';}
  q.oninput=draw;draw();
}
function sinav(){
  chrome('Sınav Bilgisi',null,false);setNav('sinav');
  app.innerHTML='';app.appendChild(document.getElementById('sinavTpl').content.cloneNode(true));
}
function route(){
  var h=(location.hash||'#/').slice(1);var p=h.split('/').filter(Boolean);
  if(!p.length)home();else if(p[0]==='u')unit(p[1]);else if(p[0]==='l')lesson(p[1]);else if(p[0]==='sozluk')sozluk();else if(p[0]==='sinav')sinav();else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
